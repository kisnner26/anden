name: Verificar

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.11.2
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: 26.8.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm verificar
